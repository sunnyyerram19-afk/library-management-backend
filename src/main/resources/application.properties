spring.application.name=library-management
server.port=${PORT:8080}

# ---- Database ----
# Local default: in-memory H2 (no setup needed, data resets on restart).
# For PostgreSQL set DB_URL=jdbc:postgresql://HOST:5432/DBNAME plus DB_USER and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT ----
# IMPORTANT: always set JWT_SECRET in production (at least 32 characters).
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS (comma separated list of frontend URLs, no trailing slash) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Default admin account (created on first start if it does not exist) ----
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ---- Demo data (sample books + a demo member "student"). Set SEED_DEMO_DATA=false to disable ----
app.seed-demo-data=${SEED_DEMO_DATA:true}

# ---- Library rules ----
library.loan-days=14
library.fine-per-day=5
